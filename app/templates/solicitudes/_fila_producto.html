<tr class="fila-producto">
  <td><input type="text" name="producto_nombre" list="lista-productos"
             placeholder="Nombre del producto" autocomplete="off"></td>
  <td><input type="text" name="producto_dosis" inputmode="decimal" placeholder="0,00" class="dato"></td>
  <td><input type="text" name="producto_unidad" placeholder="l/ha"></td>
  <td><button type="button" class="boton-icono" onclick="this.closest('tr').remove()"
              aria-label="Quitar este producto">&times;</button></td>
</tr>
