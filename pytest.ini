[pytest]
testpaths = tests

# Sin esto, `pytest` a secas falla con «No module named 'app'» y solo funciona
# `python -m pytest`, que agrega el directorio actual al path. La diferencia entre
# los dos comandos no es evidente y hace perder una tarde; declarar la raíz acá
# hace que las dos formas de invocarlo funcionen igual.
pythonpath = .

addopts = -q
